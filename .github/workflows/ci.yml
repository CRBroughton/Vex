name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix run nixpkgs#just -- fmt-check
      - run: nix run nixpkgs#just -- lint-check
      - run: nix run nixpkgs#just -- dead-check
      - run: nix run nixpkgs#just -- check

  # Proves Vex (mkUser / home-manager) evaluates and builds on a plain Nix runner
  test-home:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix run nixpkgs#just -- test-home

  # Proves VexOS (mkHost / NixOS) evaluates correctly
  test-os:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix run nixpkgs#just -- test-os
